<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2148b4"/>
      <stop offset=".55" stop-color="#5f2fae"/>
      <stop offset="1" stop-color="#0f7d94"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".12" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".74"/>
    </linearGradient>
    <mask id="f">
      <rect x="300" y="216" width="148" height="592" rx="74" fill="#fff"/>
      <rect x="300" y="216" width="452" height="148" rx="74" fill="#fff"/>
      <rect x="300" y="452" width="340" height="148" rx="74" fill="#fff"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#160a3c" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="225" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <g filter="url(#shadow)"><rect width="1024" height="1024" fill="url(#glass)" mask="url(#f)"/></g>
